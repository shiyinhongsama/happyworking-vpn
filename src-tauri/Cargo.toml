[package]
name = "happyworking-vpn-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "happyworking-vpn-app"

[lib]
name = "happyworking_vpn_app"
path = "src/lib.rs"

[dependencies]
happyworking-vpn-core = { path = "../crates/core" }
happyworking-vpn-sslvpn = { path = "../crates/sslvpn" }
happyworking-vpn-netops = { path = "../crates/netops" }
serde.workspace = true
serde_json = "1"
tokio.workspace = true
tokio-util.workspace = true
libc.workspace = true
keyring = "4.2.0"
tauri = { version = "2.12.4", features = [] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
