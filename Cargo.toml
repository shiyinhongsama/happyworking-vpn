[workspace]
members = ["crates/core", "crates/netops", "crates/sslvpn", "src-tauri"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
zeroize = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "process", "rt", "signal", "sync", "test-util", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
openssl = "0.10.82"
tokio-openssl = "0.6.5"
quick-xml = { version = "0.42", features = ["serialize"] }
httparse = "1.10"
base64 = "0.23"
libc = "0.2"
bytes = "1"
encoding_rs = "0.8"
